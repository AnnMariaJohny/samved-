name: SAMVED Java backend
on:
  push:
    paths: ['backend/**', '.github/workflows/samved-backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/samved-backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile and test Java backend
        run: mvn -B -f backend/pom.xml verify
