spring.application.name=samved
spring.config.import=optional:file:./.env[.properties]
server.port=${SAMVED_PORT:8080}
spring.datasource.url=${SAMVED_DB_URL:jdbc:mysql://127.0.0.1:3306/samved}
spring.datasource.username=${SAMVED_DB_USER:samved}
spring.datasource.password=${SAMVED_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SAMVED_DDL_MODE:validate}
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SAMVED_SECURE_COOKIE:false}
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
samved.reminders.zone=${SAMVED_REMINDER_ZONE:Asia/Kolkata}
samved.reminders.poll-ms=${SAMVED_REMINDER_POLL_MS:3600000}
samved.unstop.enabled=${SAMVED_UNSTOP_ENABLED:false}
samved.unstop.pages=${SAMVED_UNSTOP_PAGES:1}
samved.unstop.page-size=${SAMVED_UNSTOP_PAGE_SIZE:20}
samved.unstop.refresh-ms=${SAMVED_UNSTOP_REFRESH_MS:21600000}
