<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAMVED - Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>SAMVED</h1>
            <p class="subtitle">Your Career Guidance Helper</p>

            <form id="loginForm">

                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" maxlength="254" required>
                <label for="password">Password</label>
                <input type="password" id="password" minlength="8" maxlength="72" autocomplete="current-password" required>
                <button type="submit">Login</button>
                <p id="loginMessage"></p>
           </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
            <p class="register-text"><a href="register.html">Create your account to explore roadmaps</a></p>

        </div>

    </div>

    <script src="../api/developer-a-api.js"></script>
<script src="login.js"></script>

</body>
</html>
