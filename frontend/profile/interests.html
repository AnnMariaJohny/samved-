<body>

</div>

<!-- PORTAL -->

<div class="portal-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <h1>SAMVED <span>Portal</span></h1>
        </div>

        <div class="student-box">

            <div
                class="student-avatar"
                id="studentAvatar">
                S
            </div>

            <div class="student-details">

                <strong id="sidebarStudentName">
                    Student
                </strong>

                <span>
                    Student
                </span>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="profile.html">
                Profile
            </a>

            <a href="academic.html">
                Academic Details
            </a>

            <a href="interests.html" class="active">
                Interests
            </a>

            <a href="skills.html">
                Skills
            </a>

            <a href="strengths.html">
                Strengths
            </a>

            <a href="values.html">
                Values
            </a>

            <a href="careergoal.html">

                Career Goal
            </a>

            <a href="../assessment/assessment.html">

                Assessment
            </a>

            <a href="../dashboard/index.html">Dashboard &amp; Career Journey</a>
</nav>


        <div class="sidebar-bottom">

            <button
                type="button"
                class="sidebar-logout"
                onclick="logout()">

                Logout

            </button>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="portal-main">

        <header class="portal-header">

            <h2 id="pageTitle">
                Interests
            </h2>

            <div class="header-student">

                Student:
                <strong id="headerStudentName">
                    Student
                </strong>

            </div>

        </header>




<!-- STUDENT NAME -->



<div class="profile-container">

    <h1>SAMVED</h1>

    <p class="profile-subtitle">
        Your Interests
    </p>


    <!-- SELECT INTERESTS -->

    <div class="profile-card">

        <h2>Select Your Interests</h2>

        <div class="option-grid">

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Research
            </button>

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Technology
            </button>

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Science
            </button>

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Business
            </button>

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Design
            </button>

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Healthcare
            </button>

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Environment
            </button>

            <button type="button"
                class="interest-option"
                onclick="toggleInterest(this)">
                Teaching
            </button>

        </div>


        <button
            type="button"
            id="saveInterests"
            onclick="saveInterests()">

            Save Interests

        </button>


        <p id="interestMessage"></p>

    </div>


    <!-- SAVED INTERESTS -->

    <div class="profile-card">

        <h2>My Selected Interests</h2>

        <div id="selectedInterestsList">

            <p>No interests saved yet.</p>

        </div>

        <button
            type="button"
            onclick="clearInterests()">
            Reset Interests
        </button>

    </div>


</div>




<script src="../api/developer-a-api.js"></script>
<script src="../api/session.js"></script>
<script src="profile-sections.js"></script>
<script src="survey-navigation.js"></script>
</body>

</html>
