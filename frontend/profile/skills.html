<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Skills - SAMVED</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

<link rel="stylesheet" href="../api/roadmap-hub.css">
</head>


<body>
 

<!-- PORTAL -->

<div class="portal-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <h1>SAMVED <span>Portal</span></h1>
        </div>

        <div class="student-box">

            <div
                class="student-avatar"
                id="studentAvatar">
                S
            </div>

            <div class="student-details">

                <strong id="sidebarStudentName">
                    Student
                </strong>

                <span>
                    Student
                </span>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="profile.html">
                Profile
            </a>

            <a href="academic.html">
                Academic Details
            </a>

            <a href="interests.html">
                Interests
            </a>

            <a href="skills.html" class="active">
                Skills
            </a>

            <a href="strengths.html">
                Strengths
            </a>

            <a href="values.html">
                Values
            </a>

            <a href="careergoal.html">
                Career Goal
            </a>

            <a href="../assessment/assessment.html">
                Assessment
            </a>

            <a href="../dashboard/index.html">Dashboard &amp; Career Journey</a>
</nav>


        <div class="sidebar-bottom">

            <button
                type="button"
                class="sidebar-logout"
                onclick="logout()">

                Logout

            </button>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="portal-main">

        <header class="portal-header">

            <h2 id="pageTitle">
                Skills
            </h2>

            <div class="header-student">

                Student:
                <strong id="headerStudentName">
                    Student
                </strong>

            </div>

        </header>


<!-- STUDENT NAME -->




<div class="profile-container">


    <h1>SAMVED</h1>

    <p class="profile-subtitle">
        Your Skills
    </p>

    <div class="profile-card">

        <h2>Add Your Skills</h2>

        <p>
            Add a skill and select your current proficiency level.
        </p>


        <div class="skill-form">


            <label for="skill">
                Skill
            </label>


            <input
                type="text"
                id="skill"
                placeholder="Example: Python">


            <label for="skillLevel">
                Skill Level
            </label>


            <select id="skillLevel">

                <option value="">
                    Select Skill Level
                </option>

                <option value="Beginner">
                    Beginner
                </option>

                <option value="Intermediate">
                    Intermediate
                </option>

                <option value="Advanced">
                    Advanced
                </option>

            </select>


            <button
                type="button"
                onclick="addSkill()">

                Add Skill

            </button>


            <p id="skillMessage"></p>

        </div>

    </div>

    <div class="profile-card">

        <h2>My Skills</h2>


        <div class="skills-table-container">

            <table class="skills-table">

                <thead>

                    <tr>

                        <th>
                            Skill
                        </th>

                        <th>
                            Level
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="skillsTableBody">

                </tbody>

            </table>

        </div>

    </div>


</div>





<script src="../api/developer-a-api.js"></script>
<script src="../api/session.js"></script>
<script src="profile-sections.js"></script>
<script src="survey-navigation.js"></script>
</body>

</html>
