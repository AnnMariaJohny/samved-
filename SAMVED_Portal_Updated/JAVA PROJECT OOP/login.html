<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Login - SAMVED Portal</title>
<link href="portal-pages.css" rel="stylesheet"/>
<style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: #ffffff;
      border: 1.5px solid var(--portal-card-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--portal-card-shadow);
      max-width: 920px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }
    .auth-ill-panel {
      background: linear-gradient(135deg, #f3effe 0%, #edf1fc 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    .auth-ill-img {
      max-width: 85%;
      height: auto;
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px rgba(118, 99, 235, 0.12);
      margin-bottom: 16px;
    }
    .auth-content-panel {
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    @media (max-width: 768px) {
      .auth-card { grid-template-columns: 1fr; }
      .auth-ill-panel { display: none; }
    }
  </style>
<link href="/portal-live.css" rel="stylesheet"/><link href="/api/roadmap-hub.css" rel="stylesheet"/><link href="/api/roadmap-viewer.css" rel="stylesheet"/></head>
<body data-page="login">
<div class="auth-container">
<div class="auth-card">
<!-- Left Illustration Panel -->
<div class="auth-ill-panel">
<img alt="Student Login" class="auth-ill-img" src="assets/illustrations/LOGIN.jpeg"/>
<p style="font-family: var(--font-hand); font-size: 22px; color: #7663eb; margin: 0;">
          Better Than Yesterday ♡ ✈
        </p>
<p style="font-size: 12px; color: var(--portal-text-muted); max-width: 260px; margin-top: 6px;">
          A focused student, ready to explore, learn and grow.
        </p>
</div>
<!-- Right Form Panel -->
<div class="auth-content-panel">
<div style="margin-bottom: 22px;">
<a href="welcome.html" class="portal-brand"><span class="portal-brand-mark"><img alt="" src="/assets/samved-portal-logo.png?v=7d29b29b41"/></span><span class="portal-brand-name">SAMVED <span>Portal</span><small>Where your future finds its voice</small></span></a>
<h2 style="font-family: var(--font-heading); font-size: 22px; margin: 0; color: var(--portal-text-dark);">Student Login</h2>
<p style="font-size: 13px; color: var(--portal-text-muted); margin: 4px 0 0;">
            Welcome back! Please enter your student details.
          </p>
</div>
<form id="auth-form"><div class="portal-form-group"><label class="portal-form-label" for="email">Email address</label><input autocomplete="email" class="portal-input" id="email" maxlength="254" name="email" required="" type="email"/></div><div class="portal-form-group"><label class="portal-form-label" for="password">Password</label><input autocomplete="current-password" class="portal-input" id="password" maxlength="72" minlength="8" name="password" required="" type="password"/></div><p aria-live="polite" id="portal-status" role="status"></p><button class="portal-btn portal-btn-primary" type="submit">Log in →</button><p class="portal-info-card-text"><a href="/register.html">Create an account</a></p></form>
</div>
</div>
</div>
<script src="/api/developer-a-api.js"></script><script src="/api/roadmap-viewer.js"></script><script src="/api/roadmap-hub.js"></script><script src="/portal-onboarding.js"></script><script src="/portal-app.js"></script><script defer src="/bv-entry.js"></script></body>
</html>
